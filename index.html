<!DOCTYPE html>
<html lang="fr" data-theme="basic" data-lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#131722">
</head>
<body>
    <div class="app-viewport">
        <header class="top-bar">
            <div class="top-bar-main">
                <div class="brand-zone">
                    <span class="symbol">STARZ</span>
                    <span class="badge" id="badge-mode">RÉEL</span>
                </div>
                <div class="top-actions">
                    <div class="mode-switch">
                        <button class="mode-tab active" data-mode="real">RÉEL</button>
                        <button class="mode-tab" data-mode="sim">SIM</button>
                    </div>
                    <button id="btn-snapshot" class="btn-icon" data-i18n="btn_bilan">Bilan</button>
                    <button id="btn-settings" class="btn-icon">⚙️</button>
                    <button id="btn-export" class="btn-icon">JSON</button>
                </div>
            </div>
            
            <div class="ohlc-ticker">
                <div class="ticker-item"><span class="lbl" data-i18n="cash">TRÉSORERIE</span><span class="val" id="tk-cash">0.00 $</span></div>
                <div class="ticker-item"><span class="lbl" data-i18n="pnl">P&L NET</span><span class="val" id="tk-pnl">+0.00 $</span></div>
                <div class="ticker-item"><span class="lbl" data-i18n="roi">ROI</span><span class="val" id="tk-roi">0.00%</span></div>
                <div class="ticker-item"><span class="lbl" data-i18n="units">UNITÉS</span><span class="val neutral" id="tk-units">0</span></div>
            </div>
        </header>

        <main class="main-layout">
            <section class="chart-area">
                <div class="chart-header-bar">
                    <div class="symbol-info">
                        <span class="pair-title">STARZ / CASH</span>
                        <span class="chart-tf" data-i18n="chart_sub">PERFORMANCE FINANCIÈRE</span>
                    </div>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="tradingChart"></canvas>
                    <div id="crosshair-legend" class="crosshair-legend"></div>
                </div>
            </section>

            <aside class="execution-sidebar">
                <div class="sidebar-tab-header">
                    <span data-i18n="execution_title">EXÉCUTION DES ORDRES</span>
                </div>

                <div id="panel-real" class="execution-panel active">
                    <div class="control-box">
                        <div class="box-title" data-i18n="box_capital">CAPITAL & STOCK</div>
                        <div class="form-row">
                            <div class="field">
                                <label data-i18n="lbl_treasury">Trésorerie</label>
                                <input type="text" inputmode="decimal" id="real-initial-cash" value="0">
                            </div>
                            <div class="field">
                                <label data-i18n="lbl_box_cost">Coût Box</label>
                                <input type="text" inputmode="decimal" id="real-box-cost" value="230">
                            </div>
                        </div>
                        <button id="btn-real-buy-box" class="btn btn-buy">+ ACHETER 1 BOX (-230$)</button>
                    </div>

                    <div class="control-box">
                        <div class="box-title" data-i18n="box_sale">VENTE CLIENT DIRECTE</div>
                        <div class="field">
                            <label data-i18n="lbl_client">Client</label>
                            <input type="text" id="client-name" placeholder="Nom du client">
                        </div>
                        <div class="form-row">
                            <div class="field">
                                <label data-i18n="lbl_model">Modèle</label>
                                <input type="text" id="client-model" placeholder="Ex: 48k">
                            </div>
                            <div class="field">
                                <label data-i18n="lbl_flavor">Goût</label>
                                <input type="text" id="client-flavor" placeholder="Ex: Menthe">
                            </div>
                        </div>
                        <div class="field">
                            <label data-i18n="lbl_price">Montant Encaissé</label>
                            <input type="text" inputmode="decimal" id="client-price" value="45">
                        </div>
                        <button id="btn-real-sell-unit" class="btn btn-sell" data-i18n="btn_validate_sale">VALIDER VENTE CLIENT</button>
                    </div>
                </div>

                <div id="panel-sim" class="execution-panel">
                    <div class="control-box">
                        <div class="box-title" data-i18n="box_sim">SIMULATION DE BOX</div>
                        <div class="form-row">
                            <div class="field">
                                <label data-i18n="lbl_box_cost">Achat Box</label>
                                <input type="text" inputmode="decimal" id="sim-box-cost" value="230">
                            </div>
                            <div class="field">
                                <label data-i18n="lbl_box_rev">Revente Box</label>
                                <input type="text" inputmode="decimal" id="sim-box-revenue" value="450">
                            </div>
                        </div>
                        <div class="form-row">
                            <button id="btn-sim-buy" class="btn btn-buy" data-i18n="btn_sim_buy">ACHAT TEST</button>
                            <button id="btn-sim-sell" class="btn btn-sell" data-i18n="btn_sim_sell">LIQUIDATION</button>
                        </div>
                    </div>
                    <div class="sim-stats">
                        <div class="stat-row"><span data-i18n="lbl_margin">MARGE NETTE:</span><strong id="sim-margin-val">+220.00 $</strong></div>
                        <div class="stat-row"><span data-i18n="lbl_profit_test">PROFIT TEST:</span><strong id="sim-pnl-val">0.00 $</strong></div>
                    </div>
                </div>

                <div class="ledger-drawer">
                    <div class="drawer-header">
                        <span data-i18n="ledger_title">CARNET D'ORDRES</span>
                        <button id="btn-clear-ledger" class="btn-clean" data-i18n="btn_clear">VIDER</button>
                    </div>
                    <div class="table-scroll">
                        <table class="pro-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th_time">HEURE</th>
                                    <th data-i18n="th_type">TYPE</th>
                                    <th data-i18n="th_detail">DÉTAIL</th>
                                    <th data-i18n="th_net">NET</th>
                                </tr>
                            </thead>
                            <tbody id="ledger-tbody">
                                <tr><td colspan="4" class="empty" data-i18n="empty_orders">AUCUN ORDRE</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div id="specimen-modal" class="modal hidden">
        <div class="modal-card modal-large">
            <div class="modal-head">
                <span data-i18n="bilan_title">Bilan</span>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body" id="specimen-content"></div>
            <div class="modal-foot">
                <button id="download-image" class="btn btn-secondary" data-i18n="btn_img">Télécharger Image</button>
                <button id="print-specimen" class="btn btn-secondary" data-i18n="btn_print">Imprimer / PDF</button>
                <button id="close-specimen" class="btn btn-primary" data-i18n="btn_close">Fermer</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-card">
            <div class="modal-head">
                <span data-i18n="settings_title">Paramètres</span>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="field" style="margin-bottom: 12px;">
                    <label data-i18n="lbl_theme">Thème Visuel</label>
                    <select id="setting-theme">
                        <option value="basic">Basic (Sombre)</option>
                        <option value="black">Black (OLED)</option>
                        <option value="white">White (Blanc & Noir)</option>
                    </select>
                </div>
                <div class="field" style="margin-bottom: 12px;">
                    <label data-i18n="lbl_lang">Langue</label>
                    <select id="setting-lang">
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="field">
                    <label data-i18n="lbl_currency">Devise</label>
                    <select id="setting-currency">
                        <option value="CAD">CAD ($)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </div>
            </div>
            <div class="modal-foot">
                <button id="save-settings" class="btn btn-primary" data-i18n="btn_save">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
        }
    </script>
</body>
</html>
